<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}"></title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/buscador.css}">
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="light">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/meus-links}"><img th:src="@{/images/save-your-links-logo.png}" height="60" width="100" alt="" /></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" th:href="@{/meus-links}">
                                <img th:src="@{/images/book-open-solid-full.svg}" height="20" width="20" alt="" />
                                Meus Links</a>
                        </li>
                    </ul>
                    <div class="navbar-actions">
                        <button class="btn btn-outline-success btn-outline-custom" type="button">
                            <svg class="button-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
                                <path d="M8 3v10M3 8h10"/>
                            </svg>
                            Cadastro link
                        </button>
                        <div class="dropdown">
                            <button class="user-avatar" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Abrir menu do usuário">
                                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                                    <circle cx="12" cy="8" r="4"/>
                                    <path d="M4 21v-2a8 8 0 0 1 16 0v2z"/>
                                </svg>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#">Conta</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#">Sair</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>
<main>
    <h1 th:text="${titulo}"></h1>

    <p th:if="${#lists.isEmpty(links)}">
        Você ainda não salvou nenhum link.
    </p>

    <ul>
        <li th:each="link : ${links}">
            <a th:href="${link}" th:text="${link}">
                Link de exemplo
            </a>
        </li>
    </ul>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
