<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/signup.css}">
    <title>Crie sua senha | Save Your Links</title>
</head>
<body class="login-page">
<main class="login-container">
    <header class="login-header">
        <img class="login-logo" th:src="@{/images/save-your-links-logo.png}" alt="Save Your Links">
    </header>

    <section class="login-card" aria-labelledby="signup-password-title">
        <h1 id="signup-password-title">Crie sua senha</h1>
        <p class="login-subtitle">Defina uma senha para acessar seus links favoritos.</p>

        <div th:if="${mensagemErro}" class="alert alert-danger" role="alert" th:text="${mensagemErro}"></div>

        <form th:action="@{/signup-valida-password}" method="post">
            <input type="hidden" name="azureCadastroToken" th:value="${azureCadastroToken}">
            <div class="login-field">
                <label for="password">Senha <span class="campo-obrigatorio">(Obrigatório)</span></label>
                <input type="password" id="password" name="password"
                       placeholder="Crie uma senha" autocomplete="new-password"
                       aria-describedby="senha-ajuda" minlength="8" required>
                <small id="senha-ajuda" class="signup-help">Use pelo menos 8 (oito) caracteres, 1 (uma) letra maiúscula e 1 (um) caractere especial.</small>
            </div>

            <div class="login-field">
                <label for="confirmPassword">Confirmar senha <span class="campo-obrigatorio">(Obrigatório)</span></label>
                <input type="password" id="confirmPassword" name="confirmPassword"
                       placeholder="Digite a senha novamente" autocomplete="new-password"
                       aria-describedby="confirmar-senha-ajuda" minlength="8" required>
                <small id="confirmar-senha-ajuda" class="signup-help" aria-live="polite"></small>
            </div>

            <button class="login-button" type="submit">Concluir cadastro</button>

            <p class="login-register">
                Já tem uma conta?
                <a th:href="@{/login}">Entrar</a>
            </p>
        </form>
    </section>

    <footer class="login-footer">Seus links favoritos, em um só lugar.</footer>
</main>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/signup-valida-password.js}"></script>
</body>
</html>
