<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo ?: 'Login | Save Your Links'}">
        Login | Save Your Links
    </title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">

<main class="login-container">
    <header class="login-header">
        <img
                class="login-logo"
                th:src="@{/images/save-your-links-logo.png}"
                alt="Save Your Links"
        >
    </header>

    <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">Bem-vindo de volta</h1>
        <p class="login-subtitle">
            Entre para acessar seus links favoritos.
        </p>

        <form th:action="@{/login}" method="post">
            <div class="login-field">
                <label for="email">E-mail</label>
                <input
                        type="email"
                        id="email"
                        name="username"
                        placeholder="seu@email.com"
                        autocomplete="username"
                        required
                >
            </div>

            <div class="login-field">
                <label for="senha">Senha</label>
                <input
                        type="password"
                        id="senha"
                        name="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                >
            </div>

            <div class="login-options">
                <label class="remember-me" for="lembrar">
                    <input
                            type="checkbox"
                            id="lembrar"
                            name="remember-me"
                    >
                    <span>Lembrar de mim</span>
                </label>

                <a th:href="@{/recuperar-senha}">
                    Esqueceu a senha?
                </a>
            </div>

            <button class="login-button" type="submit">
                Entrar
            </button>

            <p class="login-register">
                Ainda não tem uma conta?
                <a th:href="@{/signup}">Cadastre-se</a>
            </p>
        </form>
    </section>

    <footer class="login-footer">
        Seus links favoritos, em um só lugar.
    </footer>
</main>
<div th:if="${mensagemSucesso}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
        <div class="toast-body" th:text="${mensagemSucesso}">
            Conta cadastrada com sucesso.
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
</div>
</body>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/toasts.js}"></script>
</html>
