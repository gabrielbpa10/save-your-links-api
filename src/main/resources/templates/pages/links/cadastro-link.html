<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>Cadastrar link</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/cadastro-link.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>
    <main>
        <h4 class="text-primary">Cadastrar Novo Link</h4>
        <p class="text-secondary">Preencha o título e a URL para cadastrar um novo link.</p>
        <form th:action="@{/links/cadastrar}" method="post">
            <div class="mb-3">
                <label>Título do link</label>
                <input type="text"
                       class="form-control"
                       id="descTitle"
                       name="descTitle"
                       aria-label="Nome do título"
                       placeholder="Escreva um título..."
                       required>
            </div>
            <div class="mt-2">
                <label>Link</label>
                <input type="text"
                       class="form-control"
                       id="descURL"
                       name="descURL"
                       aria-label="URL link"
                       placeholder="Informe a URL aqui..."
                       required>
            </div>
            <div class="row mt-2">
                <div class="col-6">
                    <a class="btn cancelar-link" th:href="@{/meus-links}">
                        <span aria-hidden="true">&larr;</span>
                        Cancelar
                    </a>
                </div>
                <div class="col-6 d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        Cadastrar
                    </button>
                </div>
            </div>
        </form>
    </main>
    <div th:if="${mensagemErro}" class="toast toast-erro" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" th:text="${mensagemErro}">
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</body>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/toasts.js}"></script>
</html>
